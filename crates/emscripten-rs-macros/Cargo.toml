[package]
name = "emscripten-rs-macros"
version = "0.2.1"
authors = [ "Tamás Suhajda <sutajo@gmail.com>" ]
edition = "2024"
keywords = [ "emscripten", "ffi" ]
homepage = "https://github.com/sutajo/emscripten-rs-sys"
description = "Utility macros for emscripten_rs_sys"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }