[package]
name = "emscripten_rs_sys"
version = "0.2.3"
authors = [ "Tamás Suhajda <sutajo@gmail.com>" ]
edition = "2024"
keywords = [ "emscripten", "ffi" ]
description = "Autogenerated Rust bindings to the Emscripten API"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/sutajo/emscripten-rs-sys"

[features]
build_bindings = []

[dependencies]
emscripten-rs-macros = { version = "0.2.0", path = "../emscripten-rs-macros" }

[build-dependencies]
bindgen = "0.72.1"
which = "8.0.0"

[[example]]
name = "websocket"

[dev-dependencies]
libc = "0.2.175"

[package.metadata.docs.rs]
default-target = "wasm32-unknown-emscripten"

[profile.release]
lto = true