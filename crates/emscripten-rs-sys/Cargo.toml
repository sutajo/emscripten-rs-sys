[package]
name = "emscripten_rs_sys"
version = "0.3.0"
authors = [ "Tamás Suhajda <sutajo@gmail.com>" ]
edition = "2024"
keywords = [ "emscripten", "ffi" ]
description = "Autogenerated Rust bindings to the Emscripten API"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/sutajo/emscripten-rs-sys"

[features]
default = []
nightly = ["dep:emscripten-rs-macros"]
build_bindings = ["dep:bindgen", "dep:which"]

[dependencies]
emscripten-rs-macros = { version = "0.3.0", path = "../emscripten-rs-macros", optional = true }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
which = { version = "8.0.0", optional = true }

[[test]]
name = "em_asm"
required-features = ["nightly"]

[[test]]
name = "em_js"
required-features = ["nightly"]

[[example]]
name = "websocket"

[dev-dependencies]
libc = "0.2.175"

[package.metadata.docs.rs]
features = ["nightly"]
default-target = "wasm32-unknown-emscripten"

[profile.release]
lto = true