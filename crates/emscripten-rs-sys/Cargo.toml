[package]
name = "emscripten_rs_sys"
version = "0.4.0"
authors = [ "Tamás Suhajda <sutajo@gmail.com>" ]
edition = "2024"
keywords = [ "emscripten", "ffi" ]
description = "Autogenerated Rust bindings to the Emscripten API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sutajo/emscripten-rs-sys"

[features]
default = []
force_export = ["emscripten-rs-macros/force_export"]
build_bindings = ["dep:bindgen", "dep:which"]

[dependencies]
emscripten-rs-macros = { version = "0.4.0", path = "../emscripten-rs-macros" }

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
which = { version = "8.0.0", optional = true }

[[test]]
name = "em_asm"

[[test]]
name = "em_js"

[[example]]
name = "websocket"

[dev-dependencies]
libc = "0.2.175"

[package.metadata.docs.rs]
default-target = "wasm32-unknown-emscripten"

[profile.release]
lto = true